<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Dash — Sergio García & Wuwi</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div class="brand">
        <div class="logo">◆</div>
        <div>
          <p class="eyebrow">UN JUEGO DE RITMO Y REFLEJOS</p>
          <h1>NEON <span>DASH</span></h1>
        </div>
      </div>
      <div class="best-box"><span>RÉCORD</span><strong id="best">0%</strong></div>
    </header>

    <section class="stage">
      <div class="hud">
        <span id="message">Pulsa JUGAR para empezar</span>
        <span id="progress">0%</span>
      </div>
      <div class="progress-track"><div id="progressFill"></div></div>
      <canvas id="game" width="960" height="440" aria-label="Juego de plataformas neon"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <div class="big-diamond">◆</div>
          <p class="eyebrow">¿LISTO PARA EL DESAFÍO?</p>
          <h2 id="overlayTitle">¡A ritmo de neón!</h2>
          <p id="overlayText">Salta los pinchos y llega al portal final.</p>
          <button id="playBtn">▶ JUGAR</button>
        </div>
      </div>
    </section>

    <section class="bottom">
      <div class="instructions">
        <span class="key">ESPACIO</span><span class="key">↑</span>
        <p>Salta con <b>espacio</b>, <b>flecha arriba</b> o clic / toque en la pantalla.</p>
      </div>
      <div class="stats"><span>INTENTOS</span><strong id="attempts">0</strong></div>
    </section>
    <footer>Hecho por <b>Sergio García y Wuwi</b> <span>✦</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
